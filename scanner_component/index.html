<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Barcode Scanner</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <script
        src="https://unpkg.com/streamlit-component-lib/dist/index.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: transparent;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        .scanner-box {

            width: 100%;
            background: #0f172a;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 4px 18px rgba(0,0,0,0.20);
        }

        .scanner-header {

            text-align: center;

            color: white;

            font-size: 18px;

            font-weight: 700;

            padding: 14px 10px 5px 10px;
        }

        .scanner-subtitle {

            text-align: center;

            color: #cbd5e1;

            font-size: 14px;

            padding-bottom: 12px;
        }


        .camera-wrapper {

            position: relative;

            width: 100%;

            background: black;

            overflow: hidden;
        }


        #reader {

            width: 100%;

            min-height: 320px;

            background: black;
        }


        #reader video {

            width: 100% !important;

            height: 320px !important;

            object-fit: cover !important;
        }


        .scan-frame {

            position: absolute;

            z-index: 20;

            pointer-events: none;

            width: 82%;

            height: 125px;

            top: 50%;

            left: 50%;

            transform: translate(
                -50%,
                -50%
            );

            border: 3px solid #22c55e;

            border-radius: 16px;

            box-shadow:
                0 0 0 9999px rgba(0,0,0,0.25);
        }


        .scan-line {

            position: absolute;

            width: 90%;

            left: 5%;

            top: 50%;

            height: 3px;

            background: #22c55e;

            border-radius: 3px;

            animation:
                scan 1.6s
                ease-in-out
                infinite;
        }


        @keyframes scan {

            0% {

                transform:
                    translateY(-45px);
            }

            50% {

                transform:
                    translateY(45px);
            }

            100% {

                transform:
                    translateY(-45px);
            }
        }


        #status {

            text-align: center;

            color: white;

            font-weight: 600;

            font-size: 15px;

            padding: 14px 10px;

            background: #1e293b;
        }


        #status.success {

            background: #15803d;
        }


        #status.error {

            background: #b91c1c;
        }


        #reader__dashboard {

            display: none !important;
        }


        #reader img {

            display: none !important;
        }

    </style>

</head>


<body>


<div class="scanner-box">


    <div class="scanner-header">

        📷 Σάρωση Barcode

    </div>


    <div class="scanner-subtitle">

        Τοποθέτησε το barcode μέσα στο πράσινο πλαίσιο

    </div>


    <div class="camera-wrapper">


        <div id="reader"></div>


        <div class="scan-frame">

            <div class="scan-line"></div>

        </div>


    </div>


    <div id="status">

        🔎 Περιμένω barcode...

    </div>


</div>


<script>


Streamlit.setComponentReady();


let scanner = null;

let scannerRunning = false;

let lastCode = "";

let lastScanTime = 0;


/* -------------------------------------------------
   BEEP
------------------------------------------------- */

function playBeep() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx =
            new AudioContext();

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );

        oscillator.frequency.value =
            1250;

        oscillator.type =
            "sine";

        gain.gain.value =
            0.18;

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + 0.12
        );

    }

    catch (e) {

        console.log(
            "Audio error",
            e
        );

    }

}


/* -------------------------------------------------
   SUCCESS
------------------------------------------------- */

async function onScanSuccess(
    decodedText
) {

    const now =
        Date.now();


    if (
        decodedText === lastCode &&
        now - lastScanTime < 2500
    ) {

        return;
    }


    lastCode =
        decodedText;

    lastScanTime =
        now;


    const status =
        document.getElementById(
            "status"
        );


    status.innerHTML =
        "✅ Barcode: " +
        decodedText;

    status.className =
        "success";


    playBeep();


    if (
        navigator.vibrate
    ) {

        navigator.vibrate(
            100
        );

    }


    Streamlit.setComponentValue(
        decodedText
    );


    /*
       ΣΤΑΜΑΤΑΜΕ ΤΗΝ ΚΑΜΕΡΑ
       ΜΕΤΑ ΤΟ ΕΠΙΤΥΧΕΣ SCAN
    */

    if (
        scanner &&
        scannerRunning
    ) {

        try {

            await scanner.stop();

        }

        catch (e) {}

        scannerRunning =
            false;

    }

}


/* -------------------------------------------------
   CAMERA START
------------------------------------------------- */

async function startScanner() {


    const status =
        document.getElementById(
            "status"
        );


    try {


        scanner =
            new Html5Qrcode(
                "reader"
            );


        await scanner.start(


            {
                facingMode:
                    "environment"
            },


            {

                fps: 12,


                qrbox: {

                    width: 280,

                    height: 125

                },


                aspectRatio:
                    1.777778,


                formatsToSupport: [

                    Html5QrcodeSupportedFormats.EAN_13,

                    Html5QrcodeSupportedFormats.EAN_8,

                    Html5QrcodeSupportedFormats.UPC_A,

                    Html5QrcodeSupportedFormats.UPC_E

                ]

            },


            onScanSuccess,


            function() {

                /* αγνοούμε τα scan errors */

            }

        );


        scannerRunning =
            true;


        status.innerHTML =
            "🟢 Η κάμερα είναι έτοιμη";


        Streamlit.setFrameHeight(
            document.body.scrollHeight
        );


    }


    catch (error) {


        console.error(
            error
        );


        status.innerHTML =
            "⚠️ Δεν μπόρεσε να ανοίξει η πίσω κάμερα";


        status.className =
            "error";


    }

}


/* -------------------------------------------------
   START
------------------------------------------------- */

window.addEventListener(

    "load",

    function() {


        Streamlit.setFrameHeight(
            440
        );


        setTimeout(
            startScanner,
            300
        );


    }

);


/* -------------------------------------------------
   RESIZE
------------------------------------------------- */

const resizeObserver =
    new ResizeObserver(
        function() {

            Streamlit.setFrameHeight(
                document.body.scrollHeight
            );

        }
    );


resizeObserver.observe(
    document.body
);


</script>


</body>

</html>
