<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Barcode Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.scanner {
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    background: #111827;
}

.title {
    text-align: center;
    color: white;
    font-size: 18px;
    font-weight: 700;
    padding: 12px 8px 4px;
}

.subtitle {
    text-align: center;
    color: #d1d5db;
    font-size: 13px;
    padding-bottom: 10px;
}

.camera {
    position: relative;
    background: #000;
    width: 100%;
    height: 320px;
    overflow: hidden;
}

#reader {
    width: 100%;
    height: 320px;
}

#reader video {
    width: 100% !important;
    height: 320px !important;
    object-fit: cover !important;
}

.frame {
    position: absolute;
    z-index: 100;
    width: 84%;
    height: 125px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid #22c55e;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.25);
}

.line {
    position: absolute;
    left: 5%;
    width: 90%;
    height: 3px;
    background: #22c55e;
    top: 50%;
    border-radius: 5px;
    animation: scan 1.5s ease-in-out infinite;
}

@keyframes scan {

    0% {
        transform: translateY(-45px);
    }

    50% {
        transform: translateY(45px);
    }

    100% {
        transform: translateY(-45px);
    }
}

#status {
    color: white;
    background: #1f2937;
    text-align: center;
    font-weight: 600;
    padding: 13px;
}

#status.ready {
    background: #15803d;
}

#status.success {
    background: #16a34a;
}

#status.error {
    background: #b91c1c;
}

</style>
</head>

<body>

<div class="scanner">

    <div class="title">
        📷 Scanner Barcode
    </div>

    <div class="subtitle">
        Βάλε το barcode μέσα στο πράσινο πλαίσιο
    </div>

    <div class="camera">

        <div id="reader"></div>

        <div class="frame">
            <div class="line"></div>
        </div>

    </div>

    <div id="status">
        ⏳ Εκκίνηση κάμερας...
    </div>

</div>


<script>

/* =====================================================
   ΕΠΙΚΟΙΝΩΝΙΑ ΜΕ STREAMLIT
===================================================== */

function sendMessage(type, data = {}) {

    window.parent.postMessage(
        {
            isStreamlitMessage: true,
            type: type,
            ...data
        },
        "*"
    );

}


function componentReady() {

    sendMessage(
        "streamlit:componentReady",
        {
            apiVersion: 1
        }
    );

}


function setFrameHeight(height) {

    sendMessage(
        "streamlit:setFrameHeight",
        {
            height: height
        }
    );

}


function sendBarcode(value) {

    sendMessage(
        "streamlit:setComponentValue",
        {
            value: value,
            dataType: "json"
        }
    );

}


/* =====================================================
   SCANNER
===================================================== */

let scanner = null;
let scannerRunning = false;
let scanLocked = false;


async function startCamera() {

    const status =
        document.getElementById("status");

    try {

        if (
            typeof Html5Qrcode === "undefined"
        ) {

            status.innerHTML =
                "❌ Δεν φορτώθηκε ο barcode scanner.";

            status.className =
                "error";

            return;
        }


        scanner =
            new Html5Qrcode(
                "reader"
            );


        await scanner.start(

            {
                facingMode: {
                    exact: "environment"
                }
            },

            {
                fps: 12,

                qrbox: {
                    width: 280,
                    height: 120
                },

                aspectRatio: 1.777778,

                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E
                ]
            },

            async function(decodedText) {

                if (scanLocked) {
                    return;
                }

                scanLocked = true;

                status.innerHTML =
                    "✅ " + decodedText;

                status.className =
                    "success";


                if (navigator.vibrate) {

                    navigator.vibrate(100);

                }


                sendBarcode(
                    decodedText
                );


                if (
                    scanner &&
                    scannerRunning
                ) {

                    try {

                        await scanner.stop();

                    } catch (e) {}

                }

                scannerRunning =
                    false;

            },

            function() {

                // Τα αποτυχημένα frames αγνοούνται.

            }

        );


        scannerRunning =
            true;


        status.innerHTML =
            "🟢 Έτοιμο για σάρωση";

        status.className =
            "ready";


        setFrameHeight(
            420
        );

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );


        try {

            scanner =
                new Html5Qrcode(
                    "reader"
                );


            await scanner.start(

                {
                    facingMode: {
                        ideal: "environment"
                    }
                },

                {
                    fps: 12,

                    qrbox: {
                        width: 280,
                        height: 120
                    },

                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E
                    ]
                },

                async function(decodedText) {

                    if (scanLocked) {
                        return;
                    }

                    scanLocked = true;


                    status.innerHTML =
                        "✅ " + decodedText;

                    status.className =
                        "success";


                    sendBarcode(
                        decodedText
                    );


                    if (
                        scanner &&
                        scannerRunning
                    ) {

                        try {

                            await scanner.stop();

                        } catch (e) {}

                    }

                    scannerRunning =
                        false;

                },

                function() {}

            );


            scannerRunning =
                true;


            status.innerHTML =
                "🟢 Έτοιμο για σάρωση";

            status.className =
                "ready";

        }

        catch (error2) {

            console.error(
                error2
            );


            status.innerHTML =
                "🔴 Δεν άνοιξε η πίσω κάμερα";

            status.className =
                "error";

        }

    }

}


/* =====================================================
   START
===================================================== */

componentReady();

setFrameHeight(
    420
);


setTimeout(
    startCamera,
    500
);

</script>

</body>
</html>
