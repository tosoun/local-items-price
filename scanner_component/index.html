<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Barcode Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

.scanner {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 14px;
    background: #111827;
}

.title {
    text-align: center;
    color: white;
    font-size: 17px;
    font-weight: 700;
    padding: 8px 6px 2px;
}

.subtitle {
    text-align: center;
    color: #d1d5db;
    font-size: 12px;
    padding: 0 6px 6px;
}

.camera {
    position: relative;
    background: #000;
    width: 100%;
    height: 240px;
    overflow: hidden;
}

#reader {
    width: 100%;
    height: 240px;
}

#reader video {
    width: 100% !important;
    height: 240px !important;
    object-fit: cover !important;
}


/* -----------------------------------------------------
   ΠΛΑΙΣΙΟ ΓΙΑ ΟΡΙΖΟΝΤΙΟ + ΚΑΘΕΤΟ BARCODE
----------------------------------------------------- */

.frame {
    position: absolute;
    z-index: 100;

    width: 76%;
    height: 175px;

    top: 50%;
    left: 50%;

    transform: translate(
        -50%,
        -50%
    );

    border: 3px solid #22c55e;

    border-radius: 12px;

    pointer-events: none;

    box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.18);
}


/* -----------------------------------------------------
   ΚΙΝΟΥΜΕΝΗ ΓΡΑΜΜΗ
----------------------------------------------------- */

.line {
    position: absolute;

    left: 5%;

    width: 90%;

    height: 3px;

    background: #22c55e;

    top: 50%;

    border-radius: 5px;

    animation:
        scan 1.6s
        ease-in-out
        infinite;
}


@keyframes scan {

    0% {
        transform:
            translateY(-68px);
    }

    50% {
        transform:
            translateY(68px);
    }

    100% {
        transform:
            translateY(-68px);
    }
}


/* -----------------------------------------------------
   STATUS
----------------------------------------------------- */

#status {
    color: white;

    background: #1f2937;

    text-align: center;

    font-weight: 600;

    font-size: 14px;

    padding: 9px 6px;
}


#status.ready {
    background: #15803d;
}


#status.success {
    background: #16a34a;
}


#status.error {
    background: #b91c1c;
}

</style>

</head>


<body>


<div class="scanner">

    <div class="title">
        📷 Scanner Barcode
    </div>

    <div class="subtitle">
        Barcode οριζόντια ή κάθετα
    </div>


    <div class="camera">

        <div id="reader"></div>


        <div class="frame">

            <div class="line"></div>

        </div>

    </div>


    <div id="status">

        ⏳ Εκκίνηση κάμερας...

    </div>

</div>



<script>


/* =====================================================
   STREAMLIT
===================================================== */

function sendMessage(
    type,
    data = {}
) {

    window.parent.postMessage(

        {

            isStreamlitMessage: true,

            type: type,

            ...data

        },

        "*"
    );
}



function componentReady() {

    sendMessage(

        "streamlit:componentReady",

        {
            apiVersion: 1
        }

    );
}



function setFrameHeight(
    height
) {

    sendMessage(

        "streamlit:setFrameHeight",

        {
            height: height
        }

    );
}



function sendBarcode(
    value
) {

    sendMessage(

        "streamlit:setComponentValue",

        {

            value: {

                code: value,

                scan_id:
                    Date.now()

            },

            dataType:
                "json"

        }

    );
}



/* =====================================================
   ΗΧΟΙ
===================================================== */

let audioContext = null;



function getAudioContext() {

    if (
        !audioContext
    ) {

        audioContext =
            new (

                window.AudioContext ||

                window.webkitAudioContext

            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    return audioContext;
}



/* =====================================================
   SUCCESS BEEP
===================================================== */

function playSuccessBeep() {

    try {

        const ctx =
            getAudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            1100;


        gain.gain.setValueAtTime(

            0.18,

            ctx.currentTime

        );


        gain.gain.exponentialRampToValueAtTime(

            0.01,

            ctx.currentTime + 0.12

        );


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.start();


        oscillator.stop(

            ctx.currentTime + 0.12

        );

    }

    catch (e) {}

}



/* =====================================================
   ERROR BEEP
===================================================== */

function playErrorBeep() {

    try {

        const ctx =
            getAudioContext();



        function beep(
            startTime
        ) {

            const oscillator =
                ctx.createOscillator();


            const gain =
                ctx.createGain();


            oscillator.type =
                "square";


            oscillator.frequency.value =
                420;


            gain.gain.setValueAtTime(

                0.12,

                startTime

            );


            gain.gain.exponentialRampToValueAtTime(

                0.01,

                startTime + 0.12

            );


            oscillator.connect(
                gain
            );


            gain.connect(
                ctx.destination
            );


            oscillator.start(
                startTime
            );


            oscillator.stop(

                startTime + 0.12

            );

        }



        beep(
            ctx.currentTime
        );


        beep(

            ctx.currentTime + 0.18

        );

    }

    catch (e) {}

}



/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let scannerRunning = false;

let scanLocked = false;

let lastResetToken = null;

let restarting = false;



/* =====================================================
   STREAMLIT RENDER
===================================================== */

window.addEventListener(

    "message",

    function(event) {


        const data =
            event.data;


        if (!data) {

            return;

        }


        if (

            data.type !==
            "streamlit:render"

        ) {

            return;

        }


        if (!data.args) {

            return;

        }



        const newResetToken =
            data.args.reset_token;



        const scannerMessage =
            data.args.scanner_message ||
            "";



        if (

            lastResetToken === null

        ) {

            lastResetToken =
                newResetToken;


            return;

        }



        if (

            newResetToken !==
            lastResetToken

        ) {

            lastResetToken =
                newResetToken;


            restartScanner(

                scannerMessage

            );

        }

    }

);



/* =====================================================
   RESTART SCANNER
===================================================== */

async function restartScanner(
    message = ""
) {


    if (restarting) {

        return;

    }


    restarting = true;



    const status =

        document.getElementById(
            "status"
        );



    scanLocked = false;



    try {


        if (

            scanner &&

            scannerRunning

        ) {

            await scanner.stop();

        }


    }

    catch (e) {}



    scannerRunning = false;



    try {


        if (scanner) {

            scanner.clear();

        }


    }

    catch (e) {}



    scanner = null;



    status.innerHTML =
        "⏳ Εκκίνηση κάμερας...";


    status.className =
        "";



    setTimeout(

        async function() {


            await startCamera(
                message
            );


            restarting =
                false;

        },

        300

    );

}



/* =====================================================
   STATUS MESSAGE
===================================================== */

function showReadyMessage(
    message
) {


    const status =

        document.getElementById(
            "status"
        );



    if (message) {


        status.innerHTML =
            message;


        status.className =
            "ready";


        playErrorBeep();



        setTimeout(

            function() {


                if (

                    scannerRunning &&

                    !scanLocked

                ) {


                    status.innerHTML =
                        "🟢 Έτοιμο για σάρωση";


                    status.className =
                        "ready";

                }

            },

            1500

        );

    }


    else {


        status.innerHTML =
            "🟢 Έτοιμο για σάρωση";


        status.className =
            "ready";

    }

}



/* =====================================================
   BARCODE FOUND
===================================================== */

async function barcodeFound(
    decodedText
) {


    if (scanLocked) {

        return;

    }


    scanLocked = true;



    const status =

        document.getElementById(
            "status"
        );



    status.innerHTML =

        "✅ " +
        decodedText;



    status.className =
        "success";



    playSuccessBeep();



    if (
        navigator.vibrate
    ) {


        navigator.vibrate(
            100
        );

    }



    sendBarcode(
        decodedText
    );



    if (

        scanner &&

        scannerRunning

    ) {


        try {

            await scanner.stop();

        }

        catch (e) {}

    }



    scannerRunning = false;

}



/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(
    message = ""
) {


    const status =

        document.getElementById(
            "status"
        );



    try {


        if (

            typeof Html5Qrcode ===
            "undefined"

        ) {


            status.innerHTML =
                "❌ Δεν φορτώθηκε ο barcode scanner.";


            status.className =
                "error";


            return;

        }



        scanner =

            new Html5Qrcode(
                "reader"
            );



        /*
        ΣΗΜΑΝΤΙΚΟ:

        Δεν χρησιμοποιούμε πλέον
        στενό qrbox.

        Ο scanner εξετάζει
        ολόκληρη την εικόνα.

        Έτσι βοηθάμε πολύ
        τα κάθετα και λοξά barcode.
        */


        await scanner.start(


            {

                facingMode: {

                    exact:
                        "environment"

                }

            },


            {

                fps: 15,


                aspectRatio:
                    1.777778,


                formatsToSupport: [

                    Html5QrcodeSupportedFormats.EAN_13,

                    Html5QrcodeSupportedFormats.EAN_8,

                    Html5QrcodeSupportedFormats.UPC_A,

                    Html5QrcodeSupportedFormats.UPC_E

                ]

            },


            barcodeFound,


            function() {

                // Δεν βρέθηκε barcode
                // στο συγκεκριμένο frame.

            }

        );



        scannerRunning =
            true;



        showReadyMessage(
            message
        );



        setFrameHeight(
            330
        );

    }



    catch (error) {


        console.error(

            "Camera exact error:",

            error

        );



        /*
        FALLBACK ΓΙΑ iPHONE
        */


        try {


            scanner =

                new Html5Qrcode(
                    "reader"
                );



            await scanner.start(


                {

                    facingMode: {

                        ideal:
                            "environment"

                    }

                },


                {

                    fps: 15,


                    formatsToSupport: [

                        Html5QrcodeSupportedFormats.EAN_13,

                        Html5QrcodeSupportedFormats.EAN_8,

                        Html5QrcodeSupportedFormats.UPC_A,

                        Html5QrcodeSupportedFormats.UPC_E

                    ]

                },


                barcodeFound,


                function() {}

            );



            scannerRunning =
                true;



            showReadyMessage(
                message
            );



            setFrameHeight(
                330
            );

        }



        catch (error2) {


            console.error(
                error2
            );



            status.innerHTML =
                "🔴 Δεν άνοιξε η πίσω κάμερα";


            status.className =
                "error";

        }

    }

}



/* =====================================================
   iPHONE - ΕΠΙΣΤΡΟΦΗ ΑΠΟ EXCEL
===================================================== */

document.addEventListener(

    "visibilitychange",

    function() {


        if (

            document.visibilityState ===
            "visible"

        ) {


            setTimeout(

                function() {

                    restartScanner();

                },

                400

            );

        }

    }

);



window.addEventListener(

    "focus",

    function() {


        setTimeout(

            function() {

                restartScanner();

            },

            400

        );

    }

);



/* =====================================================
   START
===================================================== */

componentReady();


setFrameHeight(
    330
);



setTimeout(

    function() {

        startCamera();

    },

    500

);

</script>


</body>

</html>
