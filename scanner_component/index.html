<!DOCTYPE html>
<html lang="el">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Barcode Scanner</title>

    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
    </script>

    <script
        src="https://unpkg.com/streamlit-component-lib/dist/index.js">
    </script>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #reader {
            width: 100%;
        }

    </style>

</head>


<body>

<div id="reader"></div>


<script>

let lastCode = "";
let lastScanTime = 0;


/* ----------------------------------------------
   BEEP
---------------------------------------------- */

function playBeep() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const ctx = new AudioContext();

        if (ctx.state === "suspended") {
            ctx.resume();
        }

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );

        oscillator.type = "square";

        oscillator.frequency.value = 1350;

        gain.gain.value = 0.35;

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + 0.15
        );

    } catch (error) {

        console.log(
            "Beep error:",
            error
        );

    }

}


/* ----------------------------------------------
   ΕΠΙΤΥΧΕΣ SCAN
---------------------------------------------- */

function onScanSuccess(
    decodedText,
    decodedResult
) {

    const now = Date.now();


    /* αποφυγή διπλού scan */

    if (
        decodedText === lastCode &&
        now - lastScanTime < 2500
    ) {

        return;

    }


    lastCode = decodedText;

    lastScanTime = now;


    /* BEEP */

    playBeep();


    /* ΣΤΕΛΝΟΥΜΕ BARCODE ΣΤΟ STREAMLIT */

    Streamlit.setComponentValue(
        decodedText
    );

}


/* ----------------------------------------------
   START CAMERA
---------------------------------------------- */

const html5QrCode =
    new Html5Qrcode(
        "reader"
    );


const config = {

    fps: 20,

    qrbox: {
        width: 300,
        height: 120
    },

    aspectRatio: 1.777778,

    formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13

    ]

};


html5QrCode.start(

    {
        facingMode: "environment"
    },

    config,

    onScanSuccess,

    function(errorMessage) {

        /* αγνοούμε τα scan errors */

    }

).then(() => {

    Streamlit.setFrameHeight(
        450
    );

}).catch(error => {

    console.log(
        "Camera error:",
        error
    );

});


/* ----------------------------------------------
   STREAMLIT COMPONENT
---------------------------------------------- */

Streamlit.setComponentReady();

Streamlit.setFrameHeight(
    450
);

</script>

</body>

</html>
